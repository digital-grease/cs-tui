name: Release

# Build cross-platform release binaries and attach them to a GitHub Release
# whenever a version tag is pushed (e.g. `git tag v0.1.0 && git push --tags`).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag and the crate version must agree. The version is compiled into the
  # binary and the in-app update check compares GitHub's latest tag against it,
  # so tagging v0.4.4 without bumping Cargo.toml ships a binary that calls
  # itself 0.4.3 and then tells every user of that release to update to the
  # version they are already running. Fail here instead.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate; bump the version before tagging"
            exit 1
          fi

  # upload-rust-binary-action uploads into an existing Release but does not
  # create one, so make the Release once here; the matrix below fills it.
  create-release:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The static musl target needs a musl C toolchain because `ring` (our TLS
      # backend) compiles a little C. This sets up musl-gcc + the linker/CC env
      # so the build below uses cargo on the host instead of falling back to
      # cross/Docker. The native gnu, macOS, and Windows legs don't need it.
      - name: Set up musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      # Builds the `cs-tui` binary for the target, archives it (.tar.gz on
      # Unix, .zip on Windows), and uploads it to the Release created above.
      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: cs-tui
          target: ${{ matrix.target }}
          archive: cs-tui-$tag-$target
          # Publish a SHA-256 checksum file alongside each archive.
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
